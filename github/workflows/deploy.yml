name: Deploy Professor API

on:
  push:
    branches: [ "main" ] # Dispara sempre que houver push na main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o seu código
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Configura o Docker para podermos fazer o build
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Faz login no Docker Hub usando os Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Cria a imagem e envia para o Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # Substitua 'seu-usuario' se quiser, ou deixe dinâmico como abaixo
        tags: ${{ secrets.DOCKER_USERNAME }}/professor-api:latest

    # 5. Entra na AWS via SSH e atualiza o container
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Puxa a imagem mais nova que acabamos de subir
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/professor-api:latest
          
          # Para e remove o container antigo (se existir)
          sudo docker stop professor-api || true
          sudo docker rm professor-api || true
          
          # Roda o novo container
          sudo docker run -d \
            --name professor-api \
            --restart unless-stopped \
            -p 3000:3000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            ${{ secrets.DOCKER_USERNAME }}/professor-api:latest